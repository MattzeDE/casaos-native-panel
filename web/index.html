<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CasaOS Native Panel</title>
    <style>
... (omitted for brevity, same CSS as before) ...
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">CasaOS Native</div>
        <nav class="nav">
          <a href="#" class="active">Dashboard</a>
          <a href="#services">Services</a>
          <a href="#samba">Samba</a>
          <a href="#users">Users</a>
          <a href="#packages">Packages</a>
        </nav>
      </aside>

      <main class="content">
        <div class="header">
          <h1>Dashboard</h1>
          <span class="badge" id="modeBadge">system mode</span>
        </div>

        <section class="grid">
          <div class="card">
            <div class="label">Host</div>
            <div class="value" id="hostname">-</div>
            <div class="sub" id="osInfo">-</div>
          </div>
          <div class="card">
            <div class="label">CPU Load</div>
            <div class="value" id="loadValue">-</div>
            <div class="sub">1m / 5m / 15m</div>
          </div>
          <div class="card">
            <div class="label">RAM</div>
            <div class="value" id="ramValue">-</div>
            <div class="sub" id="ramSub">-</div>
          </div>
          <div class="card">
            <div class="label">Disk</div>
            <div class="value" id="diskValue">-</div>
            <div class="sub" id="diskSub">-</div>
          </div>
        </section>

        <section class="two-col">
          <div class="card">
            <div class="label">Services</div>
            <ul class="status-list" id="serviceList"></ul>
          </div>

          <div class="card">
            <div class="label">Packages</div>
            <ul class="package-list" id="packageList"></ul>
          </div>
        </section>

        <div style="height: 22px"></div>

        <section class="card" id="samba">
          <div class="label">Samba config</div>
          <textarea id="sambaConfig"></textarea>
          <div class="button-row">
            <button id="saveSambaBtn">Save config</button>
            <button class="secondary" id="refreshSambaBtn">Refresh</button>
          </div>
          <div id="sambaStatus" class="muted" style="margin-top: 12px; min-height: 20px;"></div>
        </section>
      </main>
    </div>

    <script>
... (omitted for brevity) ...
      function renderDashboard(data) {
        const overview = data?.overview || {};
        const metrics = data?.metrics || {};
        const services = data?.services || [];

        document.getElementById('hostname').textContent = overview.hostname || 'unknown';
        document.getElementById('osInfo').textContent = overview.os || 'unknown';
        document.getElementById('modeBadge').textContent = (overview.mode || 'system') + ' mode';

        document.getElementById('loadValue').textContent = `${Number(metrics.load1 || 0).toFixed(2)} / ${Number(metrics.load5 || 0).toFixed(2)} / ${Number(metrics.load15 || 0).toFixed(2)}`;

        const memTotal = Number(metrics.mem_total_kb || 0);
        const memAvail = Number(metrics.mem_available_kb || 0);
        const memUsed = memTotal - memAvail;
        const memPct = memTotal > 0 ? Math.round((memUsed / memTotal) * 100) : 0;
        document.getElementById('ramValue').textContent = `${(memUsed/1024).toFixed(1)} MB`;
        document.getElementById('ramSub').textContent = `${memPct}% used of ${(memTotal/1024).toFixed(0)} MB`;

        const diskPct = Number(metrics.disk_used_percent || 0).toFixed(1);
        document.getElementById('diskValue').textContent = `${diskPct}%`;
        document.getElementById('diskSub').textContent = `Free ${(Number(metrics.disk_free_bytes||0)/(1024*1024*1024)).toFixed(2)} GB of ${(Number(metrics.disk_total_bytes||0)/(1024*1024*1024)).toFixed(2)} GB`;

        document.getElementById('serviceList').innerHTML = services.map(service => `
          <li>
            <span><span class="status-dot"></span>${service.name}</span>
            <span class="muted">${service.state || 'unknown'}</span>
          </li>
        `).join('') || '<li class="muted">No services</li>';
      }

      async function loadDashboard() {
        try {
          const data = await fetchJSON('/api/v1/dashboard');
          const dashboard = data.data || {};
          state.dashboard = dashboard;
          renderDashboard(dashboard);
        } catch (err) {
          console.error(err);
        }
      }

... (omitted for brevity) ...
    </script>
  </body>
</html>

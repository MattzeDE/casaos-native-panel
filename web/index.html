<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CasaOS Native Panel</title>
    <style>
      :root {
        --bg: #07111d;
        --panel: #101d2a;
        --panel-strong: #15283d;
        --border: #21364c;
        --text: #edf4ff;
        --muted: #94a3b8;
        --accent: #4dabf7;
        --accent-strong: #1d4ed8;
        --danger: #ef4444;
        --ok: #10b981;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
      }
      .layout {
        display: grid;
        grid-template-columns: 240px 1fr;
        min-height: 100vh;
      }
      .sidebar {
        background: rgba(16, 29, 42, 0.96);
        border-right: 1px solid var(--border);
        padding: 24px 18px;
      }
      .brand {
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 28px;
        letter-spacing: 0.02em;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .nav a {
        color: var(--muted);
        text-decoration: none;
        padding: 10px 12px;
        border-radius: 10px;
        transition: 0.2s ease;
      }
      .nav a.active, .nav a:hover {
        background: var(--panel-strong);
        color: var(--text);
      }
      .content {
        padding: 30px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
      }
      .badge {
        background: rgba(77, 171, 247, 0.12);
        color: var(--accent);
        border: 1px solid rgba(77, 171, 247, 0.25);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.85rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 18px;
        margin-bottom: 22px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px 18px 16px;
      }
      .label {
        color: var(--muted);
        font-size: 0.81rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .value {
        margin-top: 10px;
        font-size: 1.8rem;
        font-weight: 700;
      }
      .sub {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .two-col {
        display: grid;
        grid-template-columns: 1.3fr 0.9fr;
        gap: 20px;
      }
      .status-list, .package-list {
        list-style: none;
        padding: 0;
        margin: 14px 0 0;
      }
      .status-list li, .package-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .status-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 8px;
        background: var(--ok);
      }
      .danger {
        color: var(--danger);
      }
      textarea {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        background: #0a1623;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 0.9rem;
      }
      .button-row {
        display: flex;
        gap: 12px;
        margin-top: 14px;
      }
      button {
        appearance: none;
        border: none;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: white;
        padding: 10px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }
      button.secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }
      .muted {
        color: var(--muted);
      }
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
        .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
        .two-col { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">CasaOS Native</div>
        <nav class="nav">
          <a href="#" class="active">Dashboard</a>
          <a href="#services">Services</a>
          <a href="#samba">Samba</a>
          <a href="#users">Users</a>
          <a href="#packages">Packages</a>
        </nav>
      </aside>

      <main class="content">
        <div class="header">
          <h1>Dashboard</h1>
          <span class="badge" id="modeBadge">system mode</span>
        </div>

        <section class="grid">
          <div class="card">
            <div class="label">Host</div>
            <div class="value" id="hostname">-</div>
            <div class="sub" id="osInfo">-</div>
          </div>
          <div class="card">
            <div class="label">CPU Load</div>
            <div class="value" id="loadValue">-</div>
            <div class="sub">1m / 5m / 15m</div>
          </div>
          <div class="card">
            <div class="label">RAM</div>
            <div class="value" id="ramValue">-</div>
            <div class="sub" id="ramSub">-</div>
          </div>
          <div class="card">
            <div class="label">Disk</div>
            <div class="value" id="diskValue">-</div>
            <div class="sub" id="diskSub">-</div>
          </div>
        </section>

        <section class="two-col">
          <div class="card">
            <div class="label">Services</div>
            <ul class="status-list" id="serviceList"></ul>
          </div>

          <div class="card">
            <div class="label">Packages</div>
            <ul class="package-list" id="packageList"></ul>
          </div>
        </section>

        <div style="height: 22px"></div>

        <section class="card" id="samba">
          <div class="label">Samba config</div>
          <textarea id="sambaConfig"></textarea>
          <div class="button-row">
            <button id="saveSambaBtn">Save config</button>
            <button class="secondary" id="refreshSambaBtn">Refresh</button>
          </div>
          <div id="sambaStatus" class="muted" style="margin-top: 12px; min-height: 20px;"></div>
        </section>
      </main>
    </div>

    <script>
      const state = {
        dashboard: null,
        services: [],
        packages: []
      };

      async function fetchJSON(url, options) {
        const res = await fetch(url, options);
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || data.error || 'Request failed');
        }
        return data;
      }

      function renderDashboard(data) {
        const overview = data?.overview || {};
        const services = data?.services || [];

        document.getElementById('hostname').textContent = overview.hostname || 'unknown';
        document.getElementById('osInfo').textContent = overview.os || 'unknown';
        document.getElementById('modeBadge').textContent = (overview.mode || 'system') + ' mode';

        const load = (overview.load || {}) || {};
        document.getElementById('loadValue').textContent = `${Number(load['1m'] || 0).toFixed(2)} / ${Number(load['5m'] || 0).toFixed(2)} / ${Number(load['15m'] || 0).toFixed(2)}`;

        document.getElementById('serviceList').innerHTML = services.map(service => `
          <li>
            <span><span class="status-dot"></span>${service.name}</span>
            <span class="muted">${service.state || 'unknown'}</span>
          </li>
        `).join('') || '<li class="muted">No services</li>';
      }

      async function loadDashboard() {
        try {
          const data = await fetchJSON('/api/v1/dashboard');
          const dashboard = data.data || {};
          state.dashboard = dashboard;
          renderDashboard(dashboard);
        } catch (err) {
          console.error(err);
        }
      }

      async function loadSambaConfig() {
        try {
          const data = await fetchJSON('/api/v1/samba/config');
          const content = data.content || '';
          document.getElementById('sambaConfig').value = content;
        } catch (err) {
          document.getElementById('sambaStatus').textContent = 'Error loading Samba config';
        }
      }

      async function saveSambaConfig() {
        const content = document.getElementById('sambaConfig').value;
        const statusEl = document.getElementById('sambaStatus');
        statusEl.textContent = 'Saving...';

        try {
          await fetchJSON('/api/v1/samba/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content })
          });
          statusEl.textContent = 'Samba config saved.';
        } catch (err) {
          statusEl.textContent = err.message || 'Save failed';
        }
      }

      document.getElementById('saveSambaBtn').addEventListener('click', saveSambaConfig);
      document.getElementById('refreshSambaBtn').addEventListener('click', loadSambaConfig);

      loadDashboard();
      loadSambaConfig();
      setInterval(loadDashboard, 15000);
    </script>
  </body>
</html>
